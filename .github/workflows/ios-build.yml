name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Select Xcode 16 to support project format (77)
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Inject GoogleService-Info.plist from GitHub Secrets if configured
      - name: Inject GoogleService-Info.plist
        env:
          PLIST_SECRET: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST_SECRET" ]; then
            echo "$PLIST_SECRET" > iosApp/iosApp/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected from secrets."
          elif [ -f "iosApp/iosApp/GoogleService-Info.plist" ]; then
            echo "Using existing GoogleService-Info.plist from repository."
          else
            echo "Warning: No GoogleService-Info.plist found!"
          fi

      # Compile the Kotlin framework first
      - name: Compile Kotlin Multiplatform Framework
        run: ./gradlew :shared:embedAndSignAppleFrameworkForXcode -Pkotlin.native.cocoapods.platform=iphoneos -Pconfiguration=Release

      # Build with Xcode 16
      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/PillFllow.app build/Payload/
          cd build
          zip -r PillFllow.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillFllow-iOS
          path: build/PillFllow.ipa
          retention-days: 7

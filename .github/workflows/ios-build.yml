name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Select Xcode 16
      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      # 2. Set up JDK 17 for Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Ensure gradlew is executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Inject GoogleService-Info.plist from Secrets if configured
      - name: Inject GoogleService-Info.plist
        env:
          PLIST_SECRET: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST_SECRET" ]; then
            echo "$PLIST_SECRET" > iosApp/iosApp/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected from secrets."
          elif [ -f "iosApp/iosApp/GoogleService-Info.plist" ]; then
            echo "Using existing GoogleService-Info.plist from repository."
          else
            echo "Warning: No GoogleService-Info.plist found!"
          fi

      # 5. Ensure App Icon is exactly 1024x1024 to satisfy Xcode actool validation
      - name: Resize App Icon
        run: |
          sips -z 1024 1024 iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/app-icon-1024.png

      # 5.5. Add Firebase Swift Package dependencies to Xcode project
      - name: Add Firebase Swift Packages
        run: |
          swift run --package-path .github/scripts/xcode_spm_setup xcode_spm_setup \
            iosApp/iosApp.xcodeproj \
            https://github.com/firebase/firebase-ios-sdk.git \
            11.1.0 \
            --plist iosApp/iosApp/GoogleService-Info.plist \
            FirebaseCore FirebaseAuth FirebaseFirestore

      # 6. Build iOS App (runs Gradle KMP compiler + links native ARM64 framework)
      - name: Build iOS App with Xcode
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.stacktrace=all"
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            PRODUCT_NAME=PillFlow \
            PRODUCT_BUNDLE_IDENTIFIER=com.riramzy.pillflow.PillFlow \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 7. Package into .ipa
      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.riramzy.pillflow.PillFlow" build/Payload/*.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.riramzy.pillflow.PillFlow" build/Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName PillFlow" build/Payload/*.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleName string PillFlow" build/Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName PillFlow" build/Payload/*.app/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PillFlow" build/Payload/*.app/Info.plist
          cd build
          zip -r PillFlow.ipa Payload

      # 8. Upload downloadable artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PillFlow-iOS
          path: build/PillFlow.ipa
          retention-days: 7